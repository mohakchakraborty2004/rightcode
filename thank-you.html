<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Thank you for using Rightcode." />
    <title>Thank You | Rightcode</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        background: #080b12;
        color: #f7f8fb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        overflow: hidden;
        background:
          radial-gradient(circle at 15% 20%, rgba(125, 92, 255, 0.22), transparent 30rem),
          radial-gradient(circle at 85% 80%, rgba(34, 211, 238, 0.15), transparent 28rem),
          #080b12;
      }

      body::before {
        position: fixed;
        inset: 0;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
        background-size: 48px 48px;
        content: "";
        mask-image: linear-gradient(to bottom, black, transparent 90%);
        pointer-events: none;
      }

      main {
        position: relative;
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 2rem;
      }

      .card {
        width: min(100%, 720px);
        padding: clamp(2rem, 7vw, 4.5rem);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 28px;
        background: rgba(14, 18, 29, 0.72);
        box-shadow: 0 32px 80px rgba(0, 0, 0, 0.35);
        text-align: center;
        backdrop-filter: blur(18px);
      }

      .mark {
        display: grid;
        width: 72px;
        height: 72px;
        margin: 0 auto 2rem;
        border-radius: 22px;
        background: linear-gradient(135deg, #8b5cf6, #22d3ee);
        box-shadow: 0 16px 40px rgba(109, 94, 252, 0.35);
        place-items: center;
      }

      .mark svg {
        width: 36px;
        height: 36px;
        fill: none;
        stroke: white;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 2.5;
      }

      .eyebrow {
        margin: 0 0 1rem;
        color: #a7b0c3;
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.4rem, 8vw, 5rem);
        line-height: 0.98;
        letter-spacing: -0.055em;
      }

      h1 span {
        background: linear-gradient(100deg, #bba7ff 15%, #7ee7f2 85%);
        background-clip: text;
        color: transparent;
      }

      .message {
        max-width: 31rem;
        margin: 1.5rem auto 0;
        color: #b7bfce;
        font-size: clamp(1rem, 2.5vw, 1.15rem);
        line-height: 1.7;
      }

      .signature {
        display: inline-flex;
        align-items: center;
        gap: 0.65rem;
        margin-top: 2.25rem;
        color: #eef0f6;
        font-size: 0.92rem;
        font-weight: 650;
      }

      .signature::before {
        width: 26px;
        height: 1px;
        background: linear-gradient(90deg, transparent, #8b95a8);
        content: "";
      }

      @media (prefers-reduced-motion: no-preference) {
        .card {
          animation: arrive 700ms cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        .mark {
          animation: arrive 700ms 120ms cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        @keyframes arrive {
          from {
            opacity: 0;
            transform: translateY(18px) scale(0.98);
          }
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="card" aria-labelledby="thank-you-title">
        <div class="mark" aria-hidden="true">
          <svg viewBox="0 0 48 48">
            <path d="m13 25 7 7 15-17" />
          </svg>
        </div>
        <p class="eyebrow">Built better, together</p>
        <h1 id="thank-you-title">Thank <span>you.</span></h1>
        <p class="message">
          Thanks for using Rightcode. We’re grateful to be part of what you’re building,
          and we can’t wait to see where your next idea takes you.
        </p>
        <p class="signature">The Rightcode team</p>
      </section>
    </main>
  </body>
</html>
